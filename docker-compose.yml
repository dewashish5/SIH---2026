services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: skillgap-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-skillgap}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: skillgap-api
    restart: always
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/skillgap
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@postgres:5432/skillgap
      - DATA_SOURCE=${DATA_SOURCE:-mock}
      - JWT_SECRET=${JWT_SECRET:-super-secret-skillgap-jwt-key-sih-2026-min-32-chars}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: backend/gateway/Dockerfile
    container_name: skillgap-gateway
    restart: always
    environment:
      - PORT=4000
      - API_URL=http://api:8000
      - JWT_SECRET=${JWT_SECRET:-super-secret-skillgap-jwt-key-sih-2026-min-32-chars}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super-secret-refresh-key-sih-2026-min-32-chars}
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@postgres:5432/skillgap
      - CORS_ORIGIN=http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: skillgap-web
    restart: always
    environment:
      - VITE_GATEWAY_URL=http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      - gateway

volumes:
  postgres_data:
